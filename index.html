<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Support Notification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #171a21; color: #c7d5e0;
      font-family: Arial, Helvetica, sans-serif; padding: 24px;
    }
    main {
      width: min(100%, 560px); background: #1b2838; padding: 38px 30px;
      border-radius: 12px; text-align: center;
      box-shadow: 0 18px 55px #0008;
    }
    .logo { color: #66c0f4; font-size: 34px; font-weight: 800; letter-spacing: 3px; }
    .tag { color: #8f98a0; font-size: 12px; letter-spacing: 2px; margin: 8px 0 30px; }
    h1 { color: #66c0f4; font-size: clamp(27px, 6vw, 42px); margin: 0 0 18px; }
    p { line-height: 1.6; margin: 10px 0; }
    .joke { color: #fff; font-size: 21px; font-weight: 700; margin-top: 24px; }
    .note { color: #8f98a0; font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">STEAM</div>
    <div class="tag">SUPPORT NOTIFICATION</div>
    <h1>HAHA GET PRANKED NOOB 💀</h1>
    <p class="joke">Your account is absolutely fine.</p>
    <p>You really thought Steam Support emailed you? 😭</p>
    <p class="note">This was just a harmless prank. No account information was requested or collected.</p>
  </main>
</body>
</html>
